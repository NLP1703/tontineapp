# Configuration Prometheus — scrape les /metrics des microservices.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:3001']

  - job_name: 'tontine-service'
    static_configs:
      - targets: ['tontine-service:3002']

  - job_name: 'notification-service'
    static_configs:
      - targets: ['notification-service:3003']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
