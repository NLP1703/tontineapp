# Règles d'alerte Prometheus (cf. README — alerte si latence > 500ms).
groups:
  - name: tontineapp-alerts
    rules:
      - alert: HighRequestLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service)) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Latence élevée sur {{ $labels.service }}"
          description: "La latence p95 dépasse 500ms depuis 2 minutes."

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service injoignable : {{ $labels.job }}"
          description: "La cible Prometheus {{ $labels.job }} ne répond plus."

      - alert: HighErrorRate
        expr: sum(rate(http_requests_total{status=~"5.."}[5m])) by (service) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Taux d'erreurs 5xx élevé sur {{ $labels.service }}"
          description: "Plus d'une erreur serveur par seconde depuis 2 minutes."
