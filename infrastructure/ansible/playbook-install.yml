# =====================================================================
# Playbook 1 — Provisionnement du VPS (Ubuntu 22.04)
# Installe : Docker, Node.js 18, K3s, Nginx + pare-feu UFW (22/80/443).
#   ansible-playbook -i inventory.ini playbook-install.yml
# =====================================================================
---
- name: Provisionner le VPS TontineApp
  hosts: vps
  become: true

  tasks:
    - name: Mettre à jour le cache APT
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Installer les dépendances système de base
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - ufw
        state: present

    # ---------------- Docker ----------------
    - name: Ajouter la clé GPG Docker
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Ajouter le dépôt Docker
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu jammy stable"
        state: present

    - name: Installer Docker Engine + Compose plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Démarrer et activer Docker
      service:
        name: docker
        state: started
        enabled: true

    # ---------------- Node.js 18 ----------------
    - name: Ajouter le dépôt NodeSource (Node.js 18)
      shell: curl -fsSL https://deb.nodesource.com/setup_18.x | bash -
      args:
        creates: /etc/apt/sources.list.d/nodesource.list

    - name: Installer Node.js
      apt:
        name: nodejs
        state: present
        update_cache: true

    # ---------------- Nginx ----------------
    - name: Installer Nginx
      apt:
        name: nginx
        state: present

    - name: Démarrer et activer Nginx
      service:
        name: nginx
        state: started
        enabled: true

    # ---------------- K3s (Kubernetes léger) ----------------
    - name: Installer K3s
      shell: curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s

    # ---------------- Pare-feu UFW ----------------
    - name: Autoriser SSH, HTTP, HTTPS
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "22"
        - "80"
        - "443"

    - name: Activer UFW (politique par défaut deny)
      ufw:
        state: enabled
        policy: deny
        direction: incoming
