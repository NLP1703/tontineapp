# Secrets applicatifs. stringData = valeurs en clair encodées par Kubernetes.
# En production : ne pas committer de vraies valeurs (utiliser Sealed Secrets / Vault).
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: tontineapp
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "change_me_in_prod"
  JWT_SECRET: "change_me_in_prod"
  # URL complète consommée par les services Node.
  DATABASE_URL: "postgresql://postgres:change_me_in_prod@postgres:5432/tontineapp"
  # Relais SMTP Gmail pour les OTP et notifications (livraison réelle).
  # SMTP_HOST / SMTP_PORT sont dans la ConfigMap app-config (smtp.gmail.com:587).
  # SMTP_PASS = "mot de passe d'application" Gmail (16 caractères, 2FA requise) — PAS
  #   le mot de passe du compte. Voir https://myaccount.google.com/apppasswords
  # SMTP_FROM doit correspondre à SMTP_USER (Gmail réécrit sinon l'expéditeur).
  # Ne pas committer de vraies valeurs : les pousser à l'exécution via
  #   kubectl -n tontineapp create secret generic app-secrets ... --dry-run=client -o yaml | kubectl apply -f -
  SMTP_USER: "your.address@gmail.com"
  SMTP_PASS: "change_me_in_prod"
  SMTP_FROM: "TontineApp <your.address@gmail.com>"
  # Seed du super_admin (cf. migration 009 / job seed:admin). Le seed ne crée le
  # compte que si aucun super_admin n'existe. Pousser de vraies valeurs à
  # l'exécution (kubectl patch), ne pas committer le mot de passe réel.
  ADMIN_EMAIL: "admin@tontineapp.local"
  ADMIN_PASSWORD: "change_me_in_prod"
