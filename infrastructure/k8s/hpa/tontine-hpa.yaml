# Horizontal Pod Autoscaler : scale le tontine-service selon la charge CPU.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tontine-service-hpa
  namespace: tontineapp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tontine-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
