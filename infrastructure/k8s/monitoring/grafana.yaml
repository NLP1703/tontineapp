# Grafana dans le cluster : visualise les métriques Prometheus.
# Source de données provisionnée automatiquement, UI servie sous /grafana/.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: tontineapp
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        # Prometheus est servi sous le préfixe /prometheus/ (route-prefix).
        url: http://prometheus:9090/prometheus
        isDefault: true
---
# Provider de dashboards : Grafana charge au démarrage tous les .json présents
# dans /var/lib/grafana/dashboards (montés depuis le ConfigMap grafana-dashboards).
# => les dashboards sont provisionnés automatiquement et survivent aux redémarrages.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: tontineapp
data:
  provider.yml: |
    apiVersion: 1
    providers:
      - name: tontineapp
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
---
# Le contenu JSON du dashboard est fourni par le ConfigMap `grafana-dashboards`,
# généré à partir de infrastructure/monitoring/grafana-dashboard.json :
#   kubectl -n tontineapp create configmap grafana-dashboards \
#     --from-file=tontineapp.json=infrastructure/monitoring/grafana-dashboard.json \
#     --dry-run=client -o yaml | kubectl apply -f -
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: tontineapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
            # UI servie derrière le gateway sur /grafana/.
            - name: GF_SERVER_ROOT_URL
              value: "http://localhost:8080/grafana/"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
          readinessProbe:
            httpGet: { path: /grafana/api/health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "300m", memory: "256Mi" }
      volumes:
        - name: datasource
          configMap:
            name: grafana-datasource
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: tontineapp
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
