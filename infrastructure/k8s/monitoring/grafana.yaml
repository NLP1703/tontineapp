# Grafana dans le cluster : visualise les métriques Prometheus.
# Source de données provisionnée automatiquement, UI servie sous /grafana/.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: tontineapp
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        # Prometheus est servi sous le préfixe /prometheus/ (route-prefix).
        url: http://prometheus:9090/prometheus
        isDefault: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: tontineapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
            # UI servie derrière le gateway sur /grafana/.
            - name: GF_SERVER_ROOT_URL
              value: "http://localhost:8080/grafana/"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources
          readinessProbe:
            httpGet: { path: /grafana/api/health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "300m", memory: "256Mi" }
      volumes:
        - name: datasource
          configMap:
            name: grafana-datasource
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: tontineapp
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
