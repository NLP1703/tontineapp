# Prometheus dans le cluster : scrape les /metrics des microservices.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: tontineapp
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/alert-rules.yml
    scrape_configs:
      - job_name: 'auth-service'
        static_configs:
          - targets: ['auth-service:3001']
      - job_name: 'tontine-service'
        static_configs:
          - targets: ['tontine-service:3002']
      - job_name: 'notification-service'
        static_configs:
          - targets: ['notification-service:3003']
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
  alert-rules.yml: |
    groups:
      - name: tontineapp-alerts
        rules:
          - alert: HighRequestLatency
            expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service)) > 0.5
            for: 2m
            labels: { severity: warning }
            annotations:
              summary: "Latence élevée sur {{ $labels.service }}"
              description: "La latence p95 dépasse 500ms depuis 2 minutes."
          - alert: ServiceDown
            expr: up == 0
            for: 1m
            labels: { severity: critical }
            annotations:
              summary: "Service injoignable : {{ $labels.job }}"
              description: "La cible Prometheus {{ $labels.job }} ne répond plus."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: tontineapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            # Servi sous /prometheus/ derrière le gateway.
            - "--web.external-url=/prometheus/"
            - "--web.route-prefix=/prometheus/"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
          readinessProbe:
            httpGet: { path: /prometheus/-/ready, port: 9090 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "300m", memory: "512Mi" }
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: tontineapp
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
