apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jenkins-pvc
  namespace: tontineapp
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-init
  namespace: tontineapp
data:
  create-admin.groovy: |
    import jenkins.model.*
    import hudson.security.*
    import jenkins.install.InstallState

    def instance = Jenkins.getInstance()

    // Skip setup wizard
    instance.setInstallState(InstallState.INITIAL_SETUP_COMPLETED)

    // Create admin user
    def hudsonRealm = new HudsonPrivateSecurityRealm(false)
    hudsonRealm.createAccount('admin', 'Jenkins2026')
    instance.setSecurityRealm(hudsonRealm)

    def strategy = new FullControlOnceLoggedInAuthorizationStrategy()
    strategy.setAllowAnonymousRead(false)
    instance.setAuthorizationStrategy(strategy)
    instance.save()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  namespace: tontineapp
  labels:
    app: jenkins
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jenkins
  template:
    metadata:
      labels:
        app: jenkins
    spec:
      securityContext:
        runAsUser: 0
      containers:
      - name: jenkins
        image: jenkins/jenkins:lts
        env:
        - name: JAVA_OPTS
          value: "-Djenkins.install.runSetupWizard=false -Xms256m -Xmx768m"
        - name: JENKINS_OPTS
          value: "--prefix=/jenkins"
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: jenkins-home
          mountPath: /var/jenkins_home
        - name: jenkins-init
          mountPath: /var/jenkins_home/init.groovy.d
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: jenkins-home
        persistentVolumeClaim:
          claimName: jenkins-pvc
      - name: jenkins-init
        configMap:
          name: jenkins-init
---
apiVersion: v1
kind: Service
metadata:
  name: jenkins
  namespace: tontineapp
spec:
  selector:
    app: jenkins
  ports:
  - port: 8080
    targetPort: 8080
