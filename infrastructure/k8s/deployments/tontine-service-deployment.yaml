apiVersion: apps/v1
kind: Deployment
metadata:
  name: tontine-service
  namespace: tontineapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tontine-service
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: tontine-service
    spec:
      containers:
        - name: tontine-service
          image: tontineapp/tontine-service:latest
          imagePullPolicy: IfNotPresent   # utilise l'image locale si déjà présente sur le node
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: NODE_ENV
              valueFrom: { configMapKeyRef: { name: app-config, key: NODE_ENV } }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: app-secrets, key: DATABASE_URL } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: app-secrets, key: JWT_SECRET } }
            - name: NOTIFICATION_URL
              value: "http://notification-service:3003"
          readinessProbe:
            httpGet: { path: /health, port: 3002 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3002 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "300m", memory: "256Mi" }
