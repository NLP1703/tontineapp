apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: tontineapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  strategy:
    type: RollingUpdate          # mise à jour sans downtime
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: tontineapp/auth-service:latest
          imagePullPolicy: IfNotPresent   # utilise l'image locale si déjà présente sur le node
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: NODE_ENV
              valueFrom: { configMapKeyRef: { name: app-config, key: NODE_ENV } }
            - name: JWT_EXPIRES_IN
              valueFrom: { configMapKeyRef: { name: app-config, key: JWT_EXPIRES_IN } }
            - name: OTP_TTL_MINUTES
              valueFrom: { configMapKeyRef: { name: app-config, key: OTP_TTL_MINUTES } }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: app-secrets, key: DATABASE_URL } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: app-secrets, key: JWT_SECRET } }
            # SMTP : hôte/port via la ConfigMap (Gmail par défaut), identifiants via le Secret.
            # Pour revenir à Mailpit (dev), repasser SMTP_HOST=mailpit / SMTP_PORT=1025 dans app-config.
            - name: SMTP_HOST
              valueFrom: { configMapKeyRef: { name: app-config, key: SMTP_HOST } }
            - name: SMTP_PORT
              valueFrom: { configMapKeyRef: { name: app-config, key: SMTP_PORT } }
            - name: SMTP_USER
              valueFrom: { secretKeyRef: { name: app-secrets, key: SMTP_USER } }
            - name: SMTP_PASS
              valueFrom: { secretKeyRef: { name: app-secrets, key: SMTP_PASS } }
            - name: SMTP_FROM
              valueFrom: { secretKeyRef: { name: app-secrets, key: SMTP_FROM } }
          readinessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "300m", memory: "256Mi" }
