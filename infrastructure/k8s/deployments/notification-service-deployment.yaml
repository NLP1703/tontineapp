apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: tontineapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: tontineapp/notification-service:latest
          imagePullPolicy: IfNotPresent   # utilise l'image locale si déjà présente sur le node
          ports:
            - containerPort: 3003
          env:
            - name: PORT
              value: "3003"
            - name: NODE_ENV
              valueFrom: { configMapKeyRef: { name: app-config, key: NODE_ENV } }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: app-secrets, key: DATABASE_URL } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: app-secrets, key: JWT_SECRET } }
            - name: SMTP_HOST
              value: "smtp.gmail.com"
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_USER
              valueFrom: { secretKeyRef: { name: app-secrets, key: SMTP_USER } }
            - name: SMTP_PASS
              valueFrom: { secretKeyRef: { name: app-secrets, key: SMTP_PASS } }
            - name: SMTP_FROM
              valueFrom: { secretKeyRef: { name: app-secrets, key: SMTP_FROM } }
            - name: NOTIFICATION_URL
              value: "http://notification-service:3003"
          readinessProbe:
            httpGet: { path: /health, port: 3003 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3003 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "300m", memory: "256Mi" }
