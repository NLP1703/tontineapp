# Config Nginx de l'API Gateway dans le cluster (DNS internes Kubernetes).
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: tontineapp
data:
  default.conf: |
    upstream auth_service         { server auth-service:3001; }
    upstream tontine_service      { server tontine-service:3002; }
    upstream notification_service { server notification-service:3003; }
    upstream frontend_app         { server frontend:80; }
    upstream mailpit_ui           { server mailpit:8025; }
    upstream grafana_ui           { server grafana:3000; }
    upstream prometheus_ui        { server prometheus:9090; }
    upstream jenkins_ui           { server jenkins:8080; }

    map $http_upgrade $connection_upgrade {
      default upgrade;
      ''      close;
    }

    server {
      listen 80;
      server_name _;
      client_max_body_size 2m;
      # Redirections relatives : sans ça, le 301 d'ajout de slash final renvoie une
      # URL absolue avec le port INTERNE (80) et casse l'accès via le port mappé 8080.
      absolute_redirect off;
      port_in_redirect off;

      # Préfixes (pas de slash final) : matchent /api/groups ET /api/groups/ ET
      # /api/groups/<id>, donc aucune redirection 301 d'ajout de slash.
      location /api/auth         { proxy_pass http://auth_service; proxy_set_header Host $host; }
      location /api/groups       { proxy_pass http://tontine_service; proxy_set_header Host $host; }
      location /api/subscription { proxy_pass http://tontine_service; proxy_set_header Host $host; }
      location /api/notify       { proxy_pass http://notification_service; proxy_set_header Host $host; }

      location /socket.io/ {
        proxy_pass http://notification_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
      }

      # Outils d'infra exposés via le gateway.
      location /mailpit/    { proxy_pass http://mailpit_ui;    proxy_set_header Host $host; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; }
      location /grafana/    { proxy_pass http://grafana_ui;    proxy_set_header Host $host; }
      location /prometheus/ { proxy_pass http://prometheus_ui; proxy_set_header Host $host; }
      location /jenkins/    {
        proxy_pass http://jenkins_ui;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
      }

      location / { proxy_pass http://frontend_app; proxy_set_header Host $host; }
    }
