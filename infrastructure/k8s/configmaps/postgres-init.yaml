# Schéma SQL complet monté dans /docker-entrypoint-initdb.d du conteneur PostgreSQL K8s.
# Inclut le schéma de base (init.sql) + toutes les migrations (001 à 005).
# Garder synchronisé avec infrastructure/db/init.sql et les fichiers migrations/.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: tontineapp
data:
  init.sql: |
    CREATE EXTENSION IF NOT EXISTS pgcrypto;

    -- Utilisateurs
    CREATE TABLE IF NOT EXISTS users (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      full_name TEXT NOT NULL,
      email TEXT NOT NULL UNIQUE,
      phone TEXT,
      password_hash TEXT NOT NULL,
      email_verified BOOLEAN NOT NULL DEFAULT false,
      created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );
    CREATE UNIQUE INDEX IF NOT EXISTS idx_users_phone ON users(phone) WHERE phone IS NOT NULL;

    -- OTP
    CREATE TABLE IF NOT EXISTS otps (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      user_id UUID NOT NULL REFERENCES users(id) ON DELETE CASCADE,
      code TEXT NOT NULL,
      purpose TEXT NOT NULL,
      created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      expires_at TIMESTAMPTZ NOT NULL,
      used_at TIMESTAMPTZ
    );
    CREATE INDEX IF NOT EXISTS idx_otps_user ON otps(user_id);

    -- Tontines (groupes)
    CREATE TABLE IF NOT EXISTS tontines (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      owner_user_id UUID NOT NULL REFERENCES users(id) ON DELETE CASCADE,
      name TEXT NOT NULL,
      description TEXT,
      contribution_amount NUMERIC(20,2) NOT NULL DEFAULT 0,
      frequency TEXT NOT NULL DEFAULT 'monthly',
      current_cycle INT NOT NULL DEFAULT 1,
      status TEXT NOT NULL DEFAULT 'active',
      payment_deadline TIMESTAMPTZ,
      payment_day INT,
      created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );
    CREATE INDEX IF NOT EXISTS idx_tontines_owner ON tontines(owner_user_id);

    -- Membres + ordre de rotation
    CREATE TABLE IF NOT EXISTS tontine_members (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      tontine_id UUID NOT NULL REFERENCES tontines(id) ON DELETE CASCADE,
      user_id UUID NOT NULL REFERENCES users(id) ON DELETE CASCADE,
      rotation_order INT NOT NULL,
      received_at TIMESTAMPTZ,
      reliability_score NUMERIC(6,2) NOT NULL DEFAULT 100,
      payout_date DATE,
      joined_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      UNIQUE (tontine_id, user_id),
      UNIQUE (tontine_id, rotation_order)
    );
    CREATE INDEX IF NOT EXISTS idx_members_tontine ON tontine_members(tontine_id);
    CREATE INDEX IF NOT EXISTS idx_members_user ON tontine_members(user_id);

    -- Rubriques de cotisation
    CREATE TABLE IF NOT EXISTS tontine_rubrics (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      tontine_id UUID NOT NULL REFERENCES tontines(id) ON DELETE CASCADE,
      name TEXT NOT NULL,
      amount NUMERIC(20,2) NOT NULL DEFAULT 0,
      created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      UNIQUE (tontine_id, name)
    );
    CREATE INDEX IF NOT EXISTS idx_rubrics_tontine ON tontine_rubrics(tontine_id);

    -- Cotisations (paiements)
    CREATE TABLE IF NOT EXISTS payments (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      user_id UUID NOT NULL REFERENCES users(id) ON DELETE CASCADE,
      tontine_id UUID NOT NULL REFERENCES tontines(id) ON DELETE CASCADE,
      cycle INT NOT NULL DEFAULT 1,
      amount NUMERIC(20,2) NOT NULL,
      days_late INT NOT NULL DEFAULT 0,
      status TEXT NOT NULL DEFAULT 'pending',
      due_date TIMESTAMPTZ,
      paid_at TIMESTAMPTZ,
      rubric TEXT,
      sender_phone TEXT,
      receiver_phone TEXT,
      created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );
    CREATE INDEX IF NOT EXISTS idx_payments_tontine ON payments(tontine_id);
    CREATE INDEX IF NOT EXISTS idx_payments_user ON payments(user_id);

    -- Notifications
    CREATE TABLE IF NOT EXISTS notifications (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      user_id UUID NOT NULL REFERENCES users(id) ON DELETE CASCADE,
      title TEXT NOT NULL,
      body TEXT NOT NULL,
      type TEXT NOT NULL DEFAULT 'info',
      read_at TIMESTAMPTZ,
      created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );
    CREATE INDEX IF NOT EXISTS idx_notifications_user ON notifications(user_id);

    -- Journal d'activité
    CREATE TABLE IF NOT EXISTS activities (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      user_id UUID NOT NULL REFERENCES users(id) ON DELETE CASCADE,
      type TEXT NOT NULL,
      meta JSONB NOT NULL DEFAULT '{}'::jsonb,
      created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );
    CREATE INDEX IF NOT EXISTS idx_activities_user ON activities(user_id);
