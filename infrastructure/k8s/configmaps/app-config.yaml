# Variables d'environnement non sensibles partagées par les services.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: tontineapp
data:
  NODE_ENV: "production"
  JWT_EXPIRES_IN: "7d"
  OTP_TTL_MINUTES: "10"
  POSTGRES_DB: "tontineapp"
  # Hôte DNS interne du service PostgreSQL.
  DB_HOST: "postgres"
  DB_PORT: "5432"
  # Relais SMTP (non sensible). Dev : SMTP_HOST=mailpit, SMTP_PORT=1025 (attrape-mail local).
  # Prod / livraison réelle : Gmail = smtp.gmail.com:587 (STARTTLS). Les identifiants
  # (SMTP_USER / SMTP_PASS / SMTP_FROM) vivent dans le Secret app-secrets.
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
