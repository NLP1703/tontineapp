# =====================================================================
# API Gateway / Reverse Proxy TontineApp
# Point d'entrée unique : route le trafic vers le frontend et les
# microservices selon le préfixe d'URL. Termine aussi le WebSocket.
# (En production, ajouter un bloc listen 443 + SSL Let's Encrypt.)
# =====================================================================

upstream auth_service        { server auth-service:3001; }
upstream tontine_service     { server tontine-service:3002; }
upstream notification_service { server notification-service:3003; }
upstream frontend_app        { server frontend:80; }

# Variables pour l'upgrade WebSocket (Socket.io)
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 2m;

  # --- Authentification (auth-service) ---
  location /api/auth/ {
    proxy_pass http://auth_service;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # --- Logique métier (tontine-service) ---
  location /api/groups/ {
    proxy_pass http://tontine_service;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # --- Abonnements Freemium (tontine-service) ---
  location /api/subscription {
    proxy_pass http://tontine_service;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # --- Notifications REST (notification-service) ---
  location /api/notify/ {
    proxy_pass http://notification_service;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # --- WebSocket temps réel (Socket.io) ---
  location /socket.io/ {
    proxy_pass http://notification_service;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
  }

  # --- Frontend SPA (React) ---
  location / {
    proxy_pass http://frontend_app;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
