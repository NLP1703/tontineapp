# =====================================================================
# TontineApp — stack de développement local complète
#   docker-compose up --build
# Accès :
#   App / API Gateway → http://localhost:8080
#   Swagger auth      → http://localhost:8080/api/auth  (docs sur :3001/api-docs)
# =====================================================================

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tontineapp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Le schéma + les migrations sont chargés au premier démarrage.
      # Préfixes numériques => ordre garanti (init avant migrations).
      - ./infrastructure/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./infrastructure/db/migrations/001_groups_features.sql:/docker-entrypoint-initdb.d/02-001_groups_features.sql:ro
      - ./infrastructure/db/migrations/002_payment_sender_receiver.sql:/docker-entrypoint-initdb.d/03-002_payment_sender_receiver.sql:ro
      - ./infrastructure/db/migrations/003_payment_deadline.sql:/docker-entrypoint-initdb.d/04-003_payment_deadline.sql:ro
      - ./infrastructure/db/migrations/004_email_verified.sql:/docker-entrypoint-initdb.d/05-004_email_verified.sql:ro
      - ./infrastructure/db/migrations/005_payment_day_and_payout.sql:/docker-entrypoint-initdb.d/06-005_payment_day_and_payout.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Serveur SMTP de développement : capture tous les emails envoyés.
  #   UI web    → http://localhost:8025
  #   SMTP      → mailpit:1025 (depuis les conteneurs)
  # En production, ne pas utiliser Mailpit : pointer SMTP_* vers un vrai relais.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  auth-service:
    build: ./services/auth-service
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-tontineapp}
      JWT_SECRET: ${JWT_SECRET:-change_me_secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      OTP_TTL_MINUTES: ${OTP_TTL_MINUTES:-10}
      # Envoi des emails (OTP). Par défaut : Mailpit (capture locale, UI sur :8025).
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-TontineApp <no-reply@tontineapp.local>}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  tontine-service:
    build: ./services/tontine-service
    environment:
      PORT: 3002
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-tontineapp}
      JWT_SECRET: ${JWT_SECRET:-change_me_secret}
      # URL interne du notification-service (sinon les notifications échouent silencieusement).
      NOTIFICATION_URL: http://notification-service:3003
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    build: ./services/notification-service
    environment:
      PORT: 3003
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-tontineapp}
      JWT_SECRET: ${JWT_SECRET:-change_me_secret}
      # Envoi des emails de notification. Par défaut : Mailpit (capture locale, UI sur :8025).
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-TontineApp <no-reply@tontineapp.local>}
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Même origine : les appels /api/* sont proxifiés par la gateway.
        VITE_AUTH_URL: ""
        VITE_TONTINE_URL: ""
        VITE_NOTIFY_URL: ""
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - frontend
      - auth-service
      - tontine-service
      - notification-service

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - auth-service
      - tontine-service
      - notification-service

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./infrastructure/monitoring/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./infrastructure/monitoring/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./infrastructure/monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/tontineapp.json:ro
    ports:
      # 3010 sur l'hôte : le port 3001 est déjà pris par auth-service.
      - "3010:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
