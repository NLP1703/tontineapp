# Config Nginx interne au conteneur frontend : sert le build Vite (SPA).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Cache long pour les assets fingerprintés (le hash dans le nom garantit
  # qu'un nouveau build = nouvelle URL, donc l'immutabilité est sûre).
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html ne doit JAMAIS être servi depuis le cache sans revalider :
  # il référence le bundle fingerprinté courant. Sans ça, un navigateur peut
  # garder un vieil index.html (cache heuristique) pointant vers un bundle
  # périmé après un déploiement -> appels API cassés / ERR_CONNECTION_REFUSED.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # Fallback SPA : toute route inconnue renvoie index.html (React Router).
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, must-revalidate";
  }
}
