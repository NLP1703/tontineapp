# Config Nginx interne au conteneur frontend : sert le build Vite (SPA).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Cache long pour les assets fingerprintés.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Fallback SPA : toute route inconnue renvoie index.html (React Router).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
